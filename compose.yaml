services:
  db:
    image: postgres:16.8-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      DATABASE_URL: ${DATABASE_URL}
    command: ["uv", "run", "alembic", "upgrade", "head"]
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-01-20T14-49-07Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dwaar_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dwaar_minio_secret}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:RELEASE.2025-01-17T23-25-50Z
    depends_on:
      minio:
        condition: service_healthy
    volumes:
      - ./infra/minio/cors.xml:/cors.xml:ro
      - ./infra/minio/init.sh:/init.sh:ro
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-dwaar_minio}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-dwaar_minio_secret}
      MINIO_BUCKET: ${S3_BUCKET:-dwaar-documents}
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      API_V1_PREFIX: ${API_V1_PREFIX}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-a-long-random-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-15}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      REFRESH_TOKEN_REMEMBER_ME_EXPIRE_DAYS: ${REFRESH_TOKEN_REMEMBER_ME_EXPIRE_DAYS:-30}
      REFRESH_COOKIE_NAME: ${REFRESH_COOKIE_NAME:-dwaar_refresh}
      REFRESH_COOKIE_PATH: ${REFRESH_COOKIE_PATH:-/api/v1/auth}
      REFRESH_COOKIE_SECURE: ${REFRESH_COOKIE_SECURE:-false}
      REFRESH_COOKIE_SAMESITE: ${REFRESH_COOKIE_SAMESITE:-lax}
      REFRESH_COOKIE_DOMAIN: ${REFRESH_COOKIE_DOMAIN:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dwaar_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dwaar_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-dwaar-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      S3_PRESIGNED_EXPIRY_SECONDS: ${S3_PRESIGNED_EXPIRY_SECONDS:-900}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  document-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      APP_NAME: ${APP_NAME}
      APP_ENV: ${APP_ENV}
      DEBUG: ${DEBUG}
      LOG_LEVEL: ${LOG_LEVEL}
      DATABASE_URL: ${DATABASE_URL}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-dwaar_minio}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-dwaar_minio_secret}
      S3_BUCKET: ${S3_BUCKET:-dwaar-documents}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_SECURE: ${S3_SECURE:-false}
      DOC_PROCESSING_POLL_INTERVAL_SECONDS: ${DOC_PROCESSING_POLL_INTERVAL_SECONDS:-2}
      DOC_PROCESSING_MAX_ATTEMPTS: ${DOC_PROCESSING_MAX_ATTEMPTS:-3}
      DOC_PROCESSING_TIMEOUT_SECONDS: ${DOC_PROCESSING_TIMEOUT_SECONDS:-300}
      DOC_PROCESSING_HEARTBEAT_INTERVAL_SECONDS: ${DOC_PROCESSING_HEARTBEAT_INTERVAL_SECONDS:-15}
      DOC_PROCESSING_STALE_HEARTBEAT_SECONDS: ${DOC_PROCESSING_STALE_HEARTBEAT_SECONDS:-90}
      DOC_PROCESSING_MAX_PAGES: ${DOC_PROCESSING_MAX_PAGES:-50}
      DOC_PROCESSING_OCR_DPI: ${DOC_PROCESSING_OCR_DPI:-280}
      DOC_PROCESSING_HEARTBEAT_PATH: /tmp/document-worker.heartbeat
      STRUCTURED_EXTRACTION_ENABLED: ${STRUCTURED_EXTRACTION_ENABLED:-false}
      STRUCTURED_EXTRACTION_PROVIDER: ${STRUCTURED_EXTRACTION_PROVIDER:-cohere}
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      COHERE_MODEL: ${COHERE_MODEL:-command-a-plus-05-2026}
      COHERE_TIMEOUT_SECONDS: ${COHERE_TIMEOUT_SECONDS:-60}
      COHERE_MAX_RETRIES: ${COHERE_MAX_RETRIES:-2}
      COHERE_TEMPERATURE: ${COHERE_TEMPERATURE:-0}
      STRUCTURED_EXTRACTION_MAX_ATTEMPTS: ${STRUCTURED_EXTRACTION_MAX_ATTEMPTS:-3}
    command:
      [
        "uv",
        "run",
        "python",
        "-m",
        "app.modules.company_incorporation.document_processing.worker",
      ]
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"from pathlib import Path; from datetime import datetime, timezone; p=Path('/tmp/document-worker.heartbeat'); import sys; sys.exit(0 if p.exists() and (datetime.now(timezone.utc)-datetime.fromisoformat(p.read_text().strip())).total_seconds()<60 else 1)\"",
        ]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    depends_on:
      backend:
        condition: service_healthy

  fixture-generator:
    profiles: ["fixtures"]
    build:
      context: .
      dockerfile: fixtures/nivara-techfab/Dockerfile
    volumes:
      - ./fixtures/nivara-techfab:/workspace/fixtures/nivara-techfab
      - ./backend:/workspace/backend
    working_dir: /workspace/fixtures/nivara-techfab
    command: ["sh", "-c", "python scripts/generate_documents.py && python scripts/generate_quality_variants.py && python scripts/validate_fixture.py"]
    restart: "no"

volumes:
  postgres_data:
  minio_data:
  frontend_node_modules:
  frontend_next_cache:
